<body>

<div style="
width:100%;

justify-content:flex-end;

<a href="https://sobcombo.github.io/r/"

<h2 style="margin-top:5px;">

<div class="container">

<select id="combo" onchange="calc()">

</option>

<option value="400,300,0,99">

<option value="370,180,0,175">

</option>

<option value="550,375,0,50">
600/425 Namah Combo
</option>

<option value="170,170,0,529,NA">

</option>

<option value="370,180,325,50">

</option>

<option value="170,80,355,574">
1099/1009 Delight Combo
</option>

1299/1109 Mini Blast Combo
</option>

<option value="550,375,250,599">
1399/1224 All in Fun Combo
</option>

1500/925 Divine Rush Combo
</option>

4199/NA Ultimate Mega Combo
</option>

</select>

<br>

<input
type="number"
id="adults"
min="0"
max="100"
maxlength="3"
placeholder="No. of Adults"
oninput="
this.value=this.value.replace(/[^0-9]/g,'');
if(this.value.length>3)this.value=this.value.slice(0,3);
if(this.value>100)this.value=100;
calc();
"
>

<br>

<input
type="number"
id="children"
min="0"
max="100"
maxlength="3"
placeholder="No. of Children"
oninput="
this.value=this.value.replace(/[^0-9]/g,'');
if(this.value.length>3)this.value=this.value.slice(0,3);
if(this.value>100)this.value=100;
calc();
"
>

<p id="warning" style="color:red;"></p>

<div class="box">

<div class="row">
<span>TPU</span>
<span>Rs. <span id="tpu">0</span></span>
</div>

<div class="row">
<span>OEPL</span>
<span>Rs. <span id="oepl">0</span></span>
</div>

<div class="row">
<span>PAEPL</span>
<span>Rs. <span id="paepl">0</span></span>
</div>

<hr>

<div class="row">
<b>Total</b>
<span>Rs. <span id="total">0</span></span>
</div>

</div>

<br>

<input
type="tel"
id="sobInput"
maxlength="6"
placeholder="Enter 6-digit SOB ID"
>

<div id="printArea">

</div>

<div>

</div>

<div>
DATE : <span id="date"></span>
</div>

</div>

<table>

<thead>

<tr>

<th>SR</th>

</tr>

</thead>

<tbody id="dataBody"></tbody>

<tfoot>

<tr>

<td colspan="2">
<b>TOTAL</b>
</td>

<td id="tpuT"></td>
<td id="oeplT"></td>
<td id="paeplT"></td>
<td id="grandT"></td>
<td colspan="2"></td>

</tr>

</tfoot>

</table>

</div>

</div>

<div class="footer-left">
Last Updated: 12/05/2026 | V3.0
</div>

<script>

let data =
JSON.parse(localStorage.getItem("sobData")) || [];

const todayKey =
new Date().toLocaleDateString('en-GB');

const savedDate =
localStorage.getItem("sobDate");

if(savedDate !== todayKey){

data = [];

localStorage.removeItem("sobData");

localStorage.setItem("sobDate",todayKey);

}

const tpuEl =
document.getElementById("tpu");

const oeplEl =
document.getElementById("oepl");

const paeplEl =
document.getElementById("paepl");

const totalEl =
document.getElementById("total");

function calc(){

let v = combo.value;

if(!v) return;

let p = v.split(",");

let ta = +p[0];
let tc = +p[1];
let o = +p[2];
let pi = +p[3];

let na = p[4] === "NA";

let a =
Math.max(0,+adults.value||0);

let c =
Math.max(0,+children.value||0);

warning.innerText =
(na && c>0)
? "⚠ Children not allowed"
: "";

let tpu =
(a*ta) + (c*tc);

let oepl =
(a+c)*o;

let paepl =
(a+c)*pi;

let total =
tpu + oepl + paepl;

tpuEl.innerText = tpu;
oeplEl.innerText = oepl;
paeplEl.innerText = paepl;
totalEl.innerText = total;

return {
tpu,
oepl,
paepl,
total
};

}

</script>

</body>
